# =====================================================================
# NextRide — Real-Time Car Analytics & Recommendation Pipeline
#
# Data flow:
#   scrapers -> ClickHouse (bronze -> silver -> gold) -> dashboard
#   Postgres (operational serving) <- backend (Express + ML service)
#     -> frontend
#
# One-shot jobs (after the core is up):
#   data-gen   seeds synthetic users / views / favorites / searches
#   recommend  precomputes recommendations
#   sync-cars  mirrors ClickHouse silver into Postgres (cars)
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# =====================================================================

name: nextride

services:
  # ------------------------------------------------------------------
  # Data warehouse (ClickHouse) - bronze/silver/gold layers
  # ------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: nextride-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native TCP
    environment:
      CLICKHOUSE_DB: bronze
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nextride
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Operational database (OLTP serving) - replaces Cassandra
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nextride-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nextride
      POSTGRES_USER: nextride
      POSTGRES_PASSWORD: nextride
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextride -d nextride"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Analytics dashboard (Streamlit over ClickHouse gold views)
  # ------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard/Dockerfile
    container_name: nextride-dashboard
    ports:
      - "8501:8501"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nextride
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # ML price prediction service
  # ------------------------------------------------------------------
  ml-service:
    build:
      context: ..
      dockerfile: infra/docker/ml-service/Dockerfile
    container_name: nextride-ml-service
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: nextride-backend
    ports:
      - "5002:5000"
    environment:
      PORT: "5000"
      PG_HOST: postgres
      PG_DATABASE: nextride
      PG_USER: nextride
      PG_PASSWORD: nextride
      ML_SERVICE_URL: http://ml-service:5001/predict
      JWT_SECRET: nextride-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Frontend (React build served by nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5002
    container_name: nextride-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # One-shot seeding of synthetic user data
  # ------------------------------------------------------------------
  data-gen:
    build:
      context: ..
      dockerfile: infra/docker/data-gen/Dockerfile
    container_name: nextride-data-gen
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_DATABASE: nextride
      PG_USER: nextride
      PG_PASSWORD: nextride
      NUM_USERS: "10"
    restart: "no"

  # ------------------------------------------------------------------
  # One-shot recommendation computation
  # ------------------------------------------------------------------
  recommend:
    build:
      context: ..
      dockerfile: infra/docker/recommend/Dockerfile
    container_name: nextride-recommend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_DATABASE: nextride
      PG_USER: nextride
      PG_PASSWORD: nextride
      MAX_USERS: "5"
    restart: "no"

volumes:
  clickhouse_data:
  postgres_data:
