# =====================================================================
# NextRide — Real-Time Car Analytics & Recommendation Pipeline
#
# Data flow:
#   producer (CSV -> Kafka) -> spark (Kafka -> clean -> Cassandra)
#   -> backend (Express API over Cassandra + ML service) -> frontend
#
# One-shot seeding:
#   cassandra-init  applies the schema
#   data-gen        seeds synthetic users / views / favorites / searches
#   recommend       precomputes recommendations
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# =====================================================================

name: nextride

services:
  # ------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: nextride-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: NextRide
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_NUM_TOKENS: "256"
      MAX_HEAP_SIZE: "768M"
      HEAP_NEWSIZE: "100M"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SELECT release_version FROM system.local\""]
      interval: 20s
      timeout: 20s
      retries: 30
      start_period: 60s

  # ------------------------------------------------------------------
  # Schema init (runs once)
  # ------------------------------------------------------------------
  cassandra-init:
    image: cassandra:4.1
    container_name: nextride-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ../infra/cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/bash", "-c", "cqlsh cassandra -f /schema.cql && echo SCHEMA_OK"]
    restart: "no"

  # ------------------------------------------------------------------
  # Data warehouse (ClickHouse) - bronze/silver/gold layers
  # ------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: nextride-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native TCP
    environment:
      CLICKHOUSE_DB: bronze
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nextride
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Messaging
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: nextride-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CLUSTER_ID: "nextride-kafka-cluster-id"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "24"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------------
  # Kafka topics init (runs once)
  # ------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: nextride-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic avito_cars --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic moteur_cars --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 && echo TOPICS_OK"]
    restart: "no"

  # ------------------------------------------------------------------
  # Streaming processing (Kafka -> clean -> Cassandra)
  # ------------------------------------------------------------------
  spark:
    build:
      context: ..
      dockerfile: infra/docker/spark/Dockerfile
    container_name: nextride-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: cars_keyspace
      CHECKPOINT_BASE: /opt/spark/checkpoints
    volumes:
      - spark_checkpoint:/opt/spark/checkpoints
      - spark_ivy:/root/.ivy2
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Data ingestion (one-shot: CSV -> Kafka)
  # ------------------------------------------------------------------
  producer:
    build:
      context: ..
      dockerfile: infra/docker/producer/Dockerfile
    container_name: nextride-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AVITO_CSV: /app/data/avito/avito_complete.csv
      MOTEUR_CSV: /app/data/moteur/moteur_complete.csv
    volumes:
      - ../data:/app/data:ro
    restart: "no"

  # ------------------------------------------------------------------
  # Analytics dashboard (Streamlit over ClickHouse gold views)
  # ------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard/Dockerfile
    container_name: nextride-dashboard
    ports:
      - "8501:8501"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nextride
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health') && echo OK\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # ML price prediction service
  # ------------------------------------------------------------------
  ml-service:
    build:
      context: ..
      dockerfile: infra/docker/ml-service/Dockerfile
    container_name: nextride-ml-service
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: nextride-backend
    ports:
      - "5002:5000"
    environment:
      PORT: "5000"
      CASSANDRA_CONTACT_POINT: cassandra
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: cars_keyspace
      ML_SERVICE_URL: http://ml-service:5001/predict
      JWT_SECRET: nextride-dev-secret-change-me
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Frontend (React build served by nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5002
    container_name: nextride-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # One-shot seeding of synthetic user data
  # ------------------------------------------------------------------
  data-gen:
    build:
      context: ..
      dockerfile: infra/docker/data-gen/Dockerfile
    container_name: nextride-data-gen
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: cars_keyspace
      WAIT_TIMEOUT: "600"
      NUM_USERS: "10"
    restart: "no"

  # ------------------------------------------------------------------
  # One-shot recommendation computation
  # ------------------------------------------------------------------
  recommend:
    build:
      context: ..
      dockerfile: infra/docker/recommend/Dockerfile
    container_name: nextride-recommend
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: cars_keyspace
      WAIT_TIMEOUT: "600"
      MAX_USERS: "5"
    restart: "no"

volumes:
  cassandra_data:
  clickhouse_data:
  kafka_data:
  spark_checkpoint:
  spark_ivy:
